name: Build & deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nooit twee deploys tegelijk; lopende deploy niet afbreken
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node installeren
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Typecheck & lint
        run: npm run check

      # Leest de Pages-instellingen: base_path is '/meritadministratie-website' zolang er
      # geen custom domain is ingesteld, en leeg zodra meritadministratie.nl actief is.
      - name: Pages configureren
        id: pages
        uses: actions/configure-pages@v5

      - name: Website bouwen (build + prerender + sitemap)
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_FORM_PROVIDER: ${{ vars.VITE_FORM_PROVIDER || 'mailto' }}
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT || '' }}
          VITE_ANALYTICS_ID: ${{ vars.VITE_ANALYTICS_ID || '' }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID || '' }}

      - name: Build-artifact uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployen naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
