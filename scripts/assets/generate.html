<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>MERIT — asset generator (dev)</title>
    <style>
      body { font-family: 'Inter Variable', system-ui, sans-serif; padding: 24px; background: #f6f7f9; color: #182433; }
      canvas { display: block; margin: 12px 0; border: 1px solid #e3e6eb; background: repeating-conic-gradient(#e9e9e9 0 25%, #fff 0 50%) 0 0 / 20px 20px; max-width: 100%; }
      pre { background: #fff; padding: 12px; border: 1px solid #e3e6eb; }
    </style>
  </head>
  <body>
    <h1>Asset generator</h1>
    <p>
      Genereert uit het originele logo (<code>src/assets/brand/merit-logo-origineel.png</code>) de
      logo-varianten, <code>og-image.png</code>, icons en <code>favicon.ico</code>, en schrijft ze
      naar <code>public/</code> via de dev-server. Open met <code>npm run dev</code> →
      <code>/scripts/assets/generate.html</code> en klik op de knop.
    </p>
    <button id="run" type="button">Genereer en sla op</button>
    <pre id="log">Klaar om te starten.</pre>
    <div id="out"></div>

    <script type="module">
      import '@fontsource-variable/inter';
      import '@fontsource-variable/source-serif-4';
      // Teksten op de OG-afbeelding komen uit de centrale siteconfiguratie, zodat ze
      // niet uit de pas kunnen lopen met de website zelf.
      import { siteConfig } from '/src/config/site.ts';

      // Kleuren = design tokens (src/styles/tokens.css)
      const NAVY = '#0b1f3a';
      const NAVY_ALT = '#132d50';
      const GOLD = '#c9a24c';
      const WHITE = '#ffffff';
      const MUTED = '#b9c2d4';

      const SANS = '"Inter Variable", Inter, system-ui, sans-serif';
      const DISPLAY = '"Source Serif 4 Variable", "Source Serif 4", Georgia, serif';

      const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
      const out = document.getElementById('out');

      function makeCanvas(w, h) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        out.appendChild(c);
        return c;
      }

      /* ---------------- Origineel logo laden en analyseren ---------------- */

      async function loadOriginal() {
        const img = new Image();
        img.src = '/src/assets/brand/merit-logo-origineel.png';
        await img.decode();
        const c = document.createElement('canvas');
        c.width = img.naturalWidth;
        c.height = img.naturalHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        return c;
      }

      /** Maakt wit transparant op basis van luminantie; optioneel navy → wit. */
      function toTransparent(srcCanvas, { navyToWhite = false } = {}) {
        const c = document.createElement('canvas');
        c.width = srcCanvas.width;
        c.height = srcCanvas.height;
        const ctx = c.getContext('2d');
        ctx.drawImage(srcCanvas, 0, 0);
        const im = ctx.getImageData(0, 0, c.width, c.height);
        const d = im.data;
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i + 1], b = d[i + 2];
          const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
          let a = lum >= 246 ? 0 : lum <= 226 ? 255 : Math.round(((246 - lum) / 20) * 255);
          if (a > 0 && navyToWhite) {
            const isGold = r - b > 40; // goud: rood duidelijk hoger dan blauw
            if (!isGold) { d[i] = 255; d[i + 1] = 255; d[i + 2] = 255; }
          }
          d[i + 3] = a;
        }
        ctx.putImageData(im, 0, 0);
        return c;
      }

      /** Leest de alfa-laag uit als een hulpstructuur voor de blokdetectie. */
      function alphaGrid(alphaCanvas) {
        const { width, height } = alphaCanvas;
        const d = alphaCanvas.getContext('2d').getImageData(0, 0, width, height).data;
        const colHas = new Array(width).fill(false);
        const rowHas = new Array(height).fill(false);
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            if (d[(y * width + x) * 4 + 3] > 40) { colHas[x] = true; rowHas[y] = true; }
          }
        }
        return { width, height, data: d, colHas, rowHas };
      }

      /** Exacte begrenzing van de inhoud binnen een kolombereik. */
      function boxWithin(grid, xa, xb) {
        const { width, height, data } = grid;
        let x0 = width, y0 = height, x1 = -1, y1 = -1;
        for (let y = 0; y < height; y++) {
          for (let x = xa; x <= xb; x++) {
            if (data[(y * width + x) * 4 + 3] > 40) {
              if (x < x0) x0 = x;
              if (x > x1) x1 = x;
              if (y < y0) y0 = y;
              if (y > y1) y1 = y;
            }
          }
        }
        return { x0, y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
      }

      /** Exacte begrenzing binnen een kolom- én rijbereik. */
      function boxWithinRows(grid, xa, xb, ya, yb) {
        const { width, data } = grid;
        let x0 = width, y0 = yb, x1 = -1, y1 = -1;
        for (let y = ya; y <= yb; y++) {
          for (let x = xa; x <= xb; x++) {
            if (data[(y * width + x) * 4 + 3] > 40) {
              if (x < x0) x0 = x;
              if (x > x1) x1 = x;
              if (y < y0) y0 = y;
              if (y > y1) y1 = y;
            }
          }
        }
        return { x0, y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
      }

      /**
       * Het bronlogo is een horizontale lockup: embleem links, woordmerk rechts,
       * gescheiden door een lege kolomzone. Onder de lockup kan een payoffregel
       * staan; die wordt apart gehouden, omdat hij op kleine formaten (header,
       * footer) onleesbaar wordt.
       */
      function findBlocks(alphaCanvas) {
        const grid = alphaGrid(alphaCanvas);
        const { width, colHas, rowHas } = grid;
        const first = colHas.indexOf(true);
        const last = width - 1 - [...colHas].reverse().indexOf(true);
        if (first < 0) throw new Error('Leeg bronlogo.');
        const top = rowHas.indexOf(true);
        const bottom = rowHas.length - 1 - [...rowHas].reverse().indexOf(true);

        // Breedste lege kolomzone tussen embleem en woordmerk
        let best = null, start = null;
        for (let x = first; x <= last + 1; x++) {
          const has = x <= last && colHas[x];
          if (!has && start === null) start = x;
          if (has && start !== null) {
            const run = { x0: start, x1: x - 1, w: x - start };
            if (!best || run.w > best.w) best = run;
            start = null;
          }
        }
        if (!best || best.w < 10) throw new Error('Geen scheiding tussen embleem en woordmerk gevonden.');

        // Lege rijzone onder de lockup: alles daaronder is de payoffregel.
        let split = null, rStart = null;
        for (let y = top; y <= bottom + 1; y++) {
          const has = y <= bottom && rowHas[y];
          if (!has && rStart === null) rStart = y;
          if (has && rStart !== null) {
            const h = y - rStart;
            if (h >= 8 && rStart - top > (bottom - top) * 0.55) split = { y0: rStart, y1: y - 1 };
            rStart = null;
          }
        }

        const lockupBottom = split ? split.y0 - 1 : bottom;
        return {
          grid,
          /** Volledige artwork, inclusief payoffregel */
          full: boxWithin(grid, first, last),
          /** Lockup zonder payoffregel — voor header, footer en og-afbeelding */
          lockup: boxWithinRows(grid, first, last, top, lockupBottom),
          emblem: boxWithinRows(grid, first, best.x0 - 1, top, lockupBottom),
          wordmark: boxWithinRows(grid, best.x1 + 1, last, top, lockupBottom),
          /** Woordmerk mét payoffregel — voor het staande logo */
          wordmarkFull: boxWithin(grid, best.x1 + 1, last),
          payoff: split ? boxWithinRows(grid, first, last, split.y1 + 1, bottom) : null,
          gap: best.w,
        };
      }

      /** Schaalt en tekent een blok uit het broncanvas. */
      function drawBlock(ctx, src, box, x, y, w, h) {
        ctx.drawImage(src, box.x0, box.y0, box.w, box.h, x, y, w, h);
      }

      /**
       * Horizontaal logo voor header en footer: de lockup zonder payoffregel.
       * Op 40 px hoogte zou die regel maar een paar pixels hoog zijn.
       */
      function composeHorizontal(src, blocks, targetWidth = 900) {
        const { lockup } = blocks;
        const scale = targetWidth / lockup.w;
        const c = makeCanvas(targetWidth, Math.round(lockup.h * scale));
        const ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        drawBlock(ctx, src, lockup, 0, 0, c.width, c.height);
        return c;
      }

      /** Staand logo: embleem boven het volledige woordmerk, inclusief payoffregel. */
      function composeStacked(src, blocks, targetWidth = 800) {
        const { emblem } = blocks;
        const wordmark = blocks.wordmarkFull ?? blocks.wordmark;
        const pad = Math.round(targetWidth * 0.025);
        const inner = targetWidth - pad * 2;

        const wordW = inner;
        const wordH = Math.round(wordmark.h * (wordW / wordmark.w));
        const embW = Math.round(inner * 0.52);
        const embH = Math.round(emblem.h * (embW / emblem.w));
        const gap = Math.round(inner * 0.055);

        const c = makeCanvas(targetWidth, pad * 2 + embH + gap + wordH);
        const ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        drawBlock(ctx, src, emblem, Math.round((targetWidth - embW) / 2), pad, embW, embH);
        drawBlock(ctx, src, wordmark, pad, pad + embH + gap, wordW, wordH);
        return c;
      }

      /** Alleen het embleem, met een kleine transparante marge. */
      function composeEmblem(src, blocks, targetWidth = 400) {
        const { emblem } = blocks;
        const scale = targetWidth / emblem.w;
        const pad = Math.round(targetWidth * 0.02);
        const w = targetWidth - pad * 2;
        const h = Math.round(emblem.h * (w / emblem.w));
        const c = makeCanvas(targetWidth, h + pad * 2);
        const ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        drawBlock(ctx, src, emblem, pad, pad, w, h);
        void scale;
        return c;
      }

      /* ---------------- OG-image 1200×630 ---------------- */

      /** Breekt een zin op in regels die binnen maxWidth passen. */
      function wrapLines(ctx, text, maxWidth) {
        const words = text.split(' ');
        const lines = [];
        let line = '';
        for (const word of words) {
          const next = line ? `${line} ${word}` : word;
          if (ctx.measureText(next).width > maxWidth && line) {
            lines.push(line);
            line = word;
          } else {
            line = next;
          }
        }
        if (line) lines.push(line);
        return lines;
      }

      function drawOg(logoWhite) {
        const c = makeCanvas(1200, 630);
        const ctx = c.getContext('2d');
        ctx.fillStyle = NAVY;
        ctx.fillRect(0, 0, 1200, 630);
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        for (let x = 0; x <= 1200; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 630); ctx.stroke(); }
        for (let y = 0; y <= 630; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1200, y); ctx.stroke(); }
        ctx.fillStyle = GOLD;
        ctx.fillRect(0, 0, 1200, 8);

        // Echt logo (witte variant)
        const lh = 104;
        const lw = lh * (logoWhite.width / logoWhite.height);
        ctx.drawImage(logoWhite, 80, 56, lw, lh);

        // Merkbelofte uit siteConfig.tagline — elke zin op een eigen regel,
        // de laatste in goud.
        const sentences = siteConfig.tagline.split('.').map((s) => s.trim()).filter(Boolean);
        ctx.font = `600 58px ${DISPLAY}`;
        let y = 300;
        sentences.forEach((sentence, i) => {
          ctx.fillStyle = i === sentences.length - 1 ? GOLD : WHITE;
          ctx.fillText(`${sentence}.`, 80, y);
          y += 72;
        });

        ctx.fillStyle = MUTED;
        ctx.font = `400 26px ${SANS}`;
        wrapLines(ctx, siteConfig.taglineSecondary, 1040).forEach((line, i) => {
          ctx.fillText(line, 80, y + 14 + i * 36);
        });

        // Voettekst met domein en e-mailadres
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(0, 556, 1200, 74);
        ctx.fillStyle = GOLD;
        ctx.beginPath(); ctx.arc(96, 593, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = WHITE;
        ctx.font = `600 24px ${SANS}`;
        ctx.fillText(siteConfig.url.replace(/^https?:\/\//, ''), 116, 602);
        ctx.fillStyle = MUTED;
        ctx.font = `400 22px ${SANS}`;
        ctx.textAlign = 'right';
        ctx.fillText(siteConfig.contact.email, 1120, 602);
        ctx.textAlign = 'left';
        return c;
      }

      /* ---------------- Icons (echt embleem, wit op navy) ---------------- */
      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function drawIcon(emblemWhite, size, { rounded = true } = {}) {
        const c = makeCanvas(size, size);
        const ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        if (rounded) { roundRect(ctx, 0, 0, size, size, size * 0.22); ctx.fillStyle = NAVY; ctx.fill(); }
        else { ctx.fillStyle = NAVY; ctx.fillRect(0, 0, size, size); }
        const inner = size * 0.72;
        const scale = inner / Math.max(emblemWhite.width, emblemWhite.height);
        const w = emblemWhite.width * scale, h = emblemWhite.height * scale;
        ctx.drawImage(emblemWhite, (size - w) / 2, (size - h) / 2, w, h);
        return c;
      }

      /* ---------------- ICO (PNG-in-ICO) ---------------- */
      async function makeIco(canvases) {
        const buffers = await Promise.all(canvases.map((c) => canvasPng(c)));
        const headerSize = 6 + 16 * buffers.length;
        const total = headerSize + buffers.reduce((n, b) => n + b.byteLength, 0);
        const outv = new DataView(new ArrayBuffer(total));
        outv.setUint16(0, 0, true); outv.setUint16(2, 1, true); outv.setUint16(4, buffers.length, true);
        let offset = headerSize;
        buffers.forEach((buf, i) => {
          const size = canvases[i].width; const e = 6 + i * 16;
          outv.setUint8(e, size === 256 ? 0 : size); outv.setUint8(e + 1, size === 256 ? 0 : size);
          outv.setUint8(e + 2, 0); outv.setUint8(e + 3, 0);
          outv.setUint16(e + 4, 1, true); outv.setUint16(e + 6, 32, true);
          outv.setUint32(e + 8, buf.byteLength, true); outv.setUint32(e + 12, offset, true);
          new Uint8Array(outv.buffer, offset, buf.byteLength).set(new Uint8Array(buf));
          offset += buf.byteLength;
        });
        return outv.buffer;
      }

      const canvasPng = (c) => new Promise((r) => c.toBlob((b) => b.arrayBuffer().then(r), 'image/png'));
      function toBase64(buffer) {
        let s = ''; const bytes = new Uint8Array(buffer);
        for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return btoa(s);
      }
      async function save(name, buffer) {
        const res = await fetch('/__dev/save-asset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, base64: toBase64(buffer) }) });
        log(`${res.ok ? '✓' : '✗'} ${name} (${Math.round(buffer.byteLength / 1024)} kB) ${res.ok ? '' : await res.text()}`);
      }

      async function run() {
        await Promise.all([
          document.fonts.load('600 58px "Source Serif 4 Variable"'),
          document.fonts.load('600 24px "Inter Variable"'),
          document.fonts.load('400 26px "Inter Variable"'),
        ]);
        out.innerHTML = '';

        const original = await loadOriginal();
        const transparent = toTransparent(original);
        const transparentWhite = toTransparent(original, { navyToWhite: true });
        const blocks = findBlocks(transparent);
        log(
          `Blokken: embleem ${blocks.emblem.w}×${blocks.emblem.h}, ` +
            `woordmerk ${blocks.wordmark.w}×${blocks.wordmark.h}, tussenruimte ${blocks.gap}px, ` +
            `payoffregel ${blocks.payoff ? `${blocks.payoff.w}×${blocks.payoff.h}` : 'geen'}`
        );

        // Logo-varianten
        const horizontal = composeHorizontal(transparent, blocks, 900);
        const horizontalWhite = composeHorizontal(transparentWhite, blocks, 900);
        const stacked = composeStacked(transparent, blocks, 800);
        const emblem = composeEmblem(transparent, blocks, 400);
        const emblemWhite = composeEmblem(transparentWhite, blocks, 400);
        log(`Horizontaal: ${horizontal.width}×${horizontal.height} (ratio ${(horizontal.width / horizontal.height).toFixed(4)})`);
        log(`Staand: ${stacked.width}×${stacked.height} — embleem: ${emblem.width}×${emblem.height}`);

        await save('brand/logo-merit.png', await canvasPng(horizontal));
        await save('brand/logo-merit-wit.png', await canvasPng(horizontalWhite));
        await save('brand/logo-merit-staand.png', await canvasPng(stacked));
        await save('brand/logo-merit-embleem.png', await canvasPng(emblem));

        // OG-image en icons op basis van het echte logo
        await save('og-image.png', await canvasPng(drawOg(horizontalWhite)));
        await save('icon-512.png', await canvasPng(drawIcon(emblemWhite, 512)));
        await save('icon-192.png', await canvasPng(drawIcon(emblemWhite, 192)));
        await save('apple-touch-icon.png', await canvasPng(drawIcon(emblemWhite, 180, { rounded: false })));
        await save('favicon.ico', await makeIco([drawIcon(emblemWhite, 16), drawIcon(emblemWhite, 32), drawIcon(emblemWhite, 48)]));
        log(`RATIO=${horizontal.width}/${horizontal.height}`);
        log('Klaar.');
      }

      document.getElementById('run').addEventListener('click', run);
      window.__generateAssets = run;
      void NAVY_ALT;
    </script>
  </body>
</html>
