<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>MERIT — asset generator (dev)</title>
    <style>
      body { font-family: 'Inter Variable', system-ui, sans-serif; padding: 24px; background: #f6f7f9; color: #182433; }
      canvas { display: block; margin: 12px 0; border: 1px solid #e3e6eb; background: repeating-conic-gradient(#e9e9e9 0 25%, #fff 0 50%) 0 0 / 20px 20px; max-width: 100%; }
      pre { background: #fff; padding: 12px; border: 1px solid #e3e6eb; }
    </style>
  </head>
  <body>
    <h1>Asset generator</h1>
    <p>
      Genereert uit het originele logo (<code>src/assets/brand/merit-logo-origineel.jpg</code>) de
      logo-varianten, <code>og-image.png</code>, icons en <code>favicon.ico</code>, en schrijft ze
      naar <code>public/</code> via de dev-server. Open met <code>npm run dev</code> →
      <code>/scripts/assets/generate.html</code> en klik op de knop.
    </p>
    <button id="run" type="button">Genereer en sla op</button>
    <pre id="log">Klaar om te starten.</pre>
    <div id="out"></div>

    <script type="module">
      import '@fontsource-variable/inter';

      // Kleuren = design tokens (src/styles/tokens.css)
      const NAVY = '#0b1f3a';
      const GOLD = '#c8a34a';
      const WHITE = '#ffffff';
      const MUTED = '#b9c2d4';

      const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
      const out = document.getElementById('out');

      function makeCanvas(w, h) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        out.appendChild(c);
        return c;
      }

      /* ---------------- Origineel logo laden en analyseren ---------------- */

      async function loadOriginal() {
        const img = new Image();
        img.src = '/src/assets/brand/merit-logo-origineel.jpg';
        await img.decode();
        const c = document.createElement('canvas');
        c.width = img.naturalWidth;
        c.height = img.naturalHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        return c;
      }

      /** Maakt wit transparant op basis van luminantie; optioneel navy → wit. */
      function toTransparent(srcCanvas, { navyToWhite = false } = {}) {
        const c = document.createElement('canvas');
        c.width = srcCanvas.width;
        c.height = srcCanvas.height;
        const ctx = c.getContext('2d');
        ctx.drawImage(srcCanvas, 0, 0);
        const im = ctx.getImageData(0, 0, c.width, c.height);
        const d = im.data;
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i + 1], b = d[i + 2];
          const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
          let a = lum >= 246 ? 0 : lum <= 226 ? 255 : Math.round(((246 - lum) / 20) * 255);
          if (a > 0 && navyToWhite) {
            const isGold = r - b > 40; // goud: rood duidelijk hoger dan blauw
            if (!isGold) { d[i] = 255; d[i + 1] = 255; d[i + 2] = 255; }
          }
          d[i + 3] = a;
        }
        ctx.putImageData(im, 0, 0);
        return c;
      }

      /** Horizontale "banden" met inhoud (embleem, MERIT, subtitel, tagline). */
      function findBands(alphaCanvas) {
        const ctx = alphaCanvas.getContext('2d');
        const { width, height } = alphaCanvas;
        const d = ctx.getImageData(0, 0, width, height).data;
        const rowHas = new Array(height).fill(false);
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x += 2) {
            if (d[(y * width + x) * 4 + 3] > 40) { rowHas[y] = true; break; }
          }
        }
        const bands = [];
        let start = null;
        for (let y = 0; y <= height; y++) {
          const has = y < height && rowHas[y];
          if (has && start === null) start = y;
          if (!has && start !== null) {
            if (y - start > 8) bands.push({ y0: start, y1: y });
            start = null;
          }
        }
        // Kolomgrenzen per band
        for (const b of bands) {
          let x0 = width, x1 = 0;
          for (let y = b.y0; y < b.y1; y++) {
            for (let x = 0; x < width; x++) {
              if (d[(y * width + x) * 4 + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; }
            }
          }
          b.x0 = x0; b.x1 = x1 + 1; b.w = b.x1 - b.x0; b.h = b.y1 - b.y0;
        }
        return bands;
      }

      function crop(src, b, pad = 0) {
        const c = document.createElement('canvas');
        c.width = b.w + pad * 2;
        c.height = b.h + pad * 2;
        c.getContext('2d').drawImage(src, b.x0, b.y0, b.w, b.h, pad, pad, b.w, b.h);
        return c;
      }

      /** Horizontaal logo: embleem links, MERIT + subtitel rechts. */
      function composeHorizontal(src, bands, height = 400) {
        const [emblem, word, sub] = bands;
        const ctx0 = document.createElement('canvas');
        const scaleE = height / emblem.h;
        const eW = Math.round(emblem.w * scaleE);
        // Tekstblok: MERIT + subtitel gestapeld, breedte gelijk aan MERIT
        const textBlockH = height * 0.74;
        const wordScale = (textBlockH * 0.68) / word.h;
        const wordW = word.w * wordScale;
        const subScale = wordW / sub.w;
        const subH = sub.h * subScale;
        const gap = Math.round(height * 0.13);
        const c = makeCanvas(Math.round(eW + gap + wordW) + 4, height);
        const ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(src, emblem.x0, emblem.y0, emblem.w, emblem.h, 0, 0, eW, height);
        const tx = eW + gap;
        const totalText = word.h * wordScale + height * 0.06 + subH;
        const ty = (height - totalText) / 2 + height * 0.02;
        ctx.drawImage(src, word.x0, word.y0, word.w, word.h, tx, ty, wordW, word.h * wordScale);
        ctx.drawImage(src, sub.x0, sub.y0, sub.w, sub.h, tx, ty + word.h * wordScale + height * 0.06, wordW, subH);
        void ctx0;
        return c;
      }

      /* ---------------- OG-image 1200×630 ---------------- */
      function drawOg(logoWhite) {
        const c = makeCanvas(1200, 630);
        const ctx = c.getContext('2d');
        ctx.fillStyle = NAVY;
        ctx.fillRect(0, 0, 1200, 630);
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        for (let x = 0; x <= 1200; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 630); ctx.stroke(); }
        for (let y = 0; y <= 630; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1200, y); ctx.stroke(); }
        ctx.fillStyle = GOLD;
        ctx.fillRect(0, 0, 1200, 8);

        // Echt logo (witte variant)
        const lh = 96;
        const lw = lh * (logoWhite.width / logoWhite.height);
        ctx.drawImage(logoWhite, 80, 64, lw, lh);

        ctx.fillStyle = WHITE;
        ctx.font = '600 66px "Inter Variable", Inter, system-ui, sans-serif';
        ctx.letterSpacing = '-1.5px';
        ctx.fillText('Wij regelen de cijfers,', 80, 330);
        ctx.fillStyle = GOLD;
        ctx.fillText('u realiseert de groei.', 80, 410);
        ctx.letterSpacing = '0px';
        ctx.fillStyle = MUTED;
        ctx.font = '400 26px "Inter Variable", Inter, system-ui, sans-serif';
        ctx.fillText('Administratie, boekhouding, aangiften, jaarwerk en AFAS voor ondernemers', 80, 470);

        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(0, 556, 1200, 74);
        ctx.fillStyle = GOLD;
        ctx.beginPath(); ctx.arc(96, 593, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = WHITE;
        ctx.font = '600 24px "Inter Variable", Inter, system-ui, sans-serif';
        ctx.fillText('meritadministratie.nl', 116, 602);
        ctx.fillStyle = MUTED;
        ctx.font = '400 22px "Inter Variable", Inter, system-ui, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('info@meritadministratie.nl', 1120, 602);
        ctx.textAlign = 'left';
        return c;
      }

      /* ---------------- Icons (echt embleem, wit op navy) ---------------- */
      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function drawIcon(emblemWhite, size, { rounded = true } = {}) {
        const c = makeCanvas(size, size);
        const ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        if (rounded) { roundRect(ctx, 0, 0, size, size, size * 0.22); ctx.fillStyle = NAVY; ctx.fill(); }
        else { ctx.fillStyle = NAVY; ctx.fillRect(0, 0, size, size); }
        const inner = size * 0.72;
        const scale = inner / Math.max(emblemWhite.width, emblemWhite.height);
        const w = emblemWhite.width * scale, h = emblemWhite.height * scale;
        ctx.drawImage(emblemWhite, (size - w) / 2, (size - h) / 2, w, h);
        return c;
      }

      /* ---------------- ICO (PNG-in-ICO) ---------------- */
      async function makeIco(canvases) {
        const buffers = await Promise.all(canvases.map((c) => canvasPng(c)));
        const headerSize = 6 + 16 * buffers.length;
        const total = headerSize + buffers.reduce((n, b) => n + b.byteLength, 0);
        const outv = new DataView(new ArrayBuffer(total));
        outv.setUint16(0, 0, true); outv.setUint16(2, 1, true); outv.setUint16(4, buffers.length, true);
        let offset = headerSize;
        buffers.forEach((buf, i) => {
          const size = canvases[i].width; const e = 6 + i * 16;
          outv.setUint8(e, size === 256 ? 0 : size); outv.setUint8(e + 1, size === 256 ? 0 : size);
          outv.setUint8(e + 2, 0); outv.setUint8(e + 3, 0);
          outv.setUint16(e + 4, 1, true); outv.setUint16(e + 6, 32, true);
          outv.setUint32(e + 8, buf.byteLength, true); outv.setUint32(e + 12, offset, true);
          new Uint8Array(outv.buffer, offset, buf.byteLength).set(new Uint8Array(buf));
          offset += buf.byteLength;
        });
        return outv.buffer;
      }

      const canvasPng = (c) => new Promise((r) => c.toBlob((b) => b.arrayBuffer().then(r), 'image/png'));
      function toBase64(buffer) {
        let s = ''; const bytes = new Uint8Array(buffer);
        for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return btoa(s);
      }
      async function save(name, buffer) {
        const res = await fetch('/__dev/save-asset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, base64: toBase64(buffer) }) });
        log(`${res.ok ? '✓' : '✗'} ${name} (${Math.round(buffer.byteLength / 1024)} kB) ${res.ok ? '' : await res.text()}`);
      }

      /** Schaal een canvas naar een maximale breedte (voor compacte PNG's). */
      function scaled(src, maxW) {
        const s = Math.min(1, maxW / src.width);
        const c = makeCanvas(Math.round(src.width * s), Math.round(src.height * s));
        const ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(src, 0, 0, c.width, c.height);
        return c;
      }

      async function run() {
        await document.fonts.load('600 66px "Inter Variable"');
        await document.fonts.load('400 26px "Inter Variable"');
        out.innerHTML = '';

        const original = await loadOriginal();
        const transparent = toTransparent(original);
        const transparentWhite = toTransparent(original, { navyToWhite: true });
        const bands = findBands(transparent);
        log(`Banden gevonden: ${bands.length} (${bands.map((b) => `${b.w}×${b.h}`).join(', ')})`);
        if (bands.length < 3) throw new Error('Verwacht minimaal 3 banden (embleem, MERIT, subtitel).');

        // Logo-varianten
        const horizontal = composeHorizontal(transparent, bands, 400);
        const horizontalWhite = composeHorizontal(transparentWhite, bands, 400);
        const stackedBox = { x0: Math.min(bands[0].x0, bands[1].x0, bands[2].x0), y0: bands[0].y0, x1: Math.max(bands[0].x1, bands[1].x1, bands[2].x1), y1: bands[2].y1 };
        stackedBox.w = stackedBox.x1 - stackedBox.x0; stackedBox.h = stackedBox.y1 - stackedBox.y0;
        const stacked = scaled(crop(transparent, stackedBox, 20), 800);
        const emblem = crop(transparent, bands[0], 8);
        const emblemWhite = crop(transparentWhite, bands[0], 8);

        await save('brand/logo-merit.png', await canvasPng(scaled(horizontal, 900)));
        await save('brand/logo-merit-wit.png', await canvasPng(scaled(horizontalWhite, 900)));
        await save('brand/logo-merit-staand.png', await canvasPng(stacked));
        await save('brand/logo-merit-embleem.png', await canvasPng(scaled(emblem, 400)));

        // OG-image en icons op basis van het echte logo
        await save('og-image.png', await canvasPng(drawOg(horizontalWhite)));
        await save('icon-512.png', await canvasPng(drawIcon(emblemWhite, 512)));
        await save('icon-192.png', await canvasPng(drawIcon(emblemWhite, 192)));
        await save('apple-touch-icon.png', await canvasPng(drawIcon(emblemWhite, 180, { rounded: false })));
        await save('favicon.ico', await makeIco([drawIcon(emblemWhite, 16), drawIcon(emblemWhite, 32), drawIcon(emblemWhite, 48)]));
        log('Klaar.');
      }

      document.getElementById('run').addEventListener('click', run);
      window.__generateAssets = run;
    </script>
  </body>
</html>
